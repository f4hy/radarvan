name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Python toolchain (uv manages the 3.13 interpreter via uv.lock /
      # .python-version). enable-cache keys off uv.lock for fast installs.
      - name: Set up uv (Python 3.13)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      # Node 20 LTS for the Vite/React frontend; npm cache keys off
      # package-lock.json.
      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      # Mirrors `make install` (uv sync + npm install / ci).
      - name: Install dependencies
        run: make install

      # Mirrors `make check` (ruff lint + mypy).
      - name: Python checks (ruff + mypy)
        run: make check

      # Mirrors `make ts-check` (prettier --check + eslint + tsc).
      - name: TypeScript checks (prettier + eslint + tsc)
        run: make ts-check

      # `uv run pytest`. The whole suite runs against a clean checkout: the
      # canonical cncstats fixture is committed (references/example_cncstats_output.json)
      # and tests/new_cncstats_output.json is tracked, so no deselects are needed.
      # DATABASE_URL is a dummy value because several modules read it at import
      # time -- no real database is contacted by the offline test suite.
      - name: Python tests (pytest)
        env:
          DATABASE_URL: "sqlite://"
        run: uv run pytest

      # Mirrors `npm test` (vitest run).
      - name: Frontend tests (vitest)
        run: npm run test

      # Mirrors `npm run build` (tsc && vite build).
      - name: Frontend build
        run: npm run build
