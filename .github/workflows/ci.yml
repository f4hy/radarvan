name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: radarvan
          POSTGRES_PASSWORD: radarvan
          POSTGRES_DB: postgres
          # Must match docker-compose.yml's `db` and `test-db`: the C locale is
          # what makes text sort the way it does on prod's RDS, so without this
          # a collation-dependent ORDER BY passes here and differs locally.
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radarvan -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Python toolchain (uv manages the 3.14 interpreter via uv.lock /
      # .python-version). enable-cache keys off uv.lock for fast installs.
      #
      # Pinned to the immutable release SHA, not a floating major tag: as of
      # v8, setup-uv stopped publishing `@v8`/`@v8.x` tags entirely (a
      # supply-chain hardening move - see
      # https://github.com/astral-sh/setup-uv/releases/tag/v8.0.0), so `@v7`
      # would otherwise be stuck forever. Bump the SHA (and this comment)
      # manually when a newer release is wanted.
      - name: Set up uv (Python 3.14)
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.14"

      # Current Node LTS for the Vite/React frontend; npm cache keys off
      # package-lock.json. Must stay >= 22.19: jsdom 30 pulls undici 8, whose
      # `engines` requires it (on Node 20 the vitest worker dies with
      # "webidl.util.markAsUncloneable is not a function"). Matches the
      # `lts/*` used by playwright.yml.
      - name: Set up Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # Mirrors `make install` (uv sync + npm install / ci).
      - name: Install dependencies
        run: make install

      # Mirrors `make check` (ruff lint + mypy).
      - name: Python checks (ruff + mypy)
        run: make check

      # Mirrors `make ts-check` (biome format check + biome lint + tsc).
      - name: TypeScript checks (biome + tsc)
        run: make ts-check

      # Mirrors `npm run build` (tsc && vite build). Must run before the pytest
      # step below: radarvan/main.py mounts StaticFiles(directory="dist") at
      # import time, and several tests (tests/test_auth_tiers.py) import
      # radarvan.main - without a built dist/ that import raises
      # RuntimeError("Directory 'dist' does not exist").
      - name: Frontend build
        run: npm run build

      # `uv run pytest`. The whole suite runs against a clean checkout: the
      # canonical cncstats fixture is committed (references/example_cncstats_output.json)
      # and tests/new_cncstats_output.json is tracked, so no deselects are needed.
      # DATABASE_URL is inert for app imports. Integration fixtures use a
      # separate URL and create/drop their own randomly named test databases.
      - name: Python tests (pytest)
        env:
          DATABASE_URL: "sqlite://"
          TEST_POSTGRES_URL: "postgresql://radarvan:radarvan@127.0.0.1:5432/postgres"
          # Turns a missing URL into a failure: without it, losing the service
          # container would skip the integration tier and still report green.
          REQUIRE_POSTGRES_TESTS: "1"
        run: uv run pytest

      # Mirrors `npm test` (vitest run).
      - name: Frontend tests (vitest)
        run: npm run test
