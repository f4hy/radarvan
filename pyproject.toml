[project]
name = "radarvan"
version = "0.1.0"
description = "Tracking generals stats"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.2",
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.0",
    "cachetools>=7.1.6",
    "cachetools-async>=0.0.5",
    "fastapi[standard]>=0.139.0",
    "fsspec[s3]>=2026.6.0",
    "google-genai>=2.16.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "numpy>=2.5.1",
    "onnxruntime>=1.28.0",
    "openskill>=6.2.0",
    "opentelemetry-api>=1.43.0",
    "opentelemetry-exporter-otlp-proto-http>=1.43.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.64b0",
    "opentelemetry-sdk>=1.43.0",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "s3fs>=2026.6.0",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
]
[dependency-groups]
dev = [
  "alembic>=1.18.5",
  "boto3-stubs[s3]>=1.43.56",
  "click>=8.4.2",
  "mypy>=2.2.0",
  "pylsp-mypy>=0.8.0",
  "pytest>=9.1.1,<10",
  "python-lsp-ruff>=2.3.1",
  "python-lsp-server[all,mypy]>=1.15.0",
  "ruff>=0.16.0",
  "s3cmd>=2.4.0",
  "sqlalchemy[mypy]>=2.0.51",
  "tqdm>=4.68.4",
  "types-cachetools>=7.0.0.20260713",
  "types-tqdm>=4.68.0.20260608",
  "datamodel-code-generator>=0.68.1",
  "pg-activity>=3.6.2",
]

# ML / model-training deps. Deliberately a NON-default group (not `dev`) so they
# are never installed into the production app — Heroku installs only
# [project.dependencies]. Install locally with `uv sync --group ml`.
# All code that uses these lives under ./ml/.
ml = [
  # Pinned to the CUDA 12.4 build: it still ships Pascal kernels (sm_50/sm_60),
  # which run on the local Quadro P4000 (CC 6.1) — verified with a live matmul.
  # Newer torch wheels (cu130) start at sm_75 and crash on Pascal. Sourced from
  # the pytorch-cu124 index below (see [tool.uv.sources]).
  # python_version markers on torch and its direct dependents: torch==2.6.0+cu124
  # has no cp314 wheel yet, which would otherwise make `uv lock` unsolvable
  # now that the main app targets 3.14. Run ML training in a separate 3.13
  # venv (`uv sync --group ml --python 3.13`) until upstream ships one.
  "torch==2.6.0; python_version < '3.14'",
  "lightning>=2.4.0; python_version < '3.14'",
  "torchmetrics>=1.5.0; python_version < '3.14'",
  "scikit-learn>=1.5.0",
  "pandas>=2.2.0",
  "pyarrow>=18.0.0",
  # ONNX export + a torch-free CPU runtime for serving the exported model.
  "onnx>=1.17.0",
  "onnxruntime>=1.28.0",
]

[tool.black]
line-length = 88

[tool.ruff.lint.pycodestyle]
max-line-length = 88

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
		"alembic/versions"
]

# Same as Black.
line-length = 88
indent-width = 4

target-version = "py314"
fix = true

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
#
# Additions beyond the original set:
#   B     flake8-bugbear      real bug patterns (mutable defaults, loop-var closures, etc.)
#   ASYNC flake8-async        blocking calls in async def (httpx/sleep/open) - matches the
#                             to_thread invariants documented in CLAUDE.md
#   DTZ   flake8-datetimez    naive datetime/date usage - this codebase has explicit
#                             UTC/Eastern game-night conversion rules to get right
#   T20   flake8-print        no stray print() - project uses structlog everywhere
#   PTH   flake8-use-pathlib  prefer pathlib over os.path
#   SIM   flake8-simplify     obvious simplifications
#   RET   flake8-return       redundant return/assign patterns
#   PERF  Perflint            avoidable perf footguns (list(dict.keys()), etc.)
#   A     flake8-builtins     shadowing builtins
#
# Deliberately NOT enabled:
#   N (pep8-naming)  - N815 fires on every camelCase Pydantic wire field, which is an
#                      intentional convention here (see api_types.py), not a bug.
#   TRY (tryceratops)- TRY003 wants custom exception classes for every raise message;
#                      too opinionated/invasive for this codebase's style.
#   BLE (blind-except), ERA (commented-code) - both have a high false-positive rate here:
#                      BLE flags the intentional best-effort except-Exception-and-notify
#                      pattern used throughout ingestion; ERA mostly flags plain
#                      descriptive comments, not actual dead code.
select = ["E4", "E7", "E9", "F", "UP", "RUF", "S", "C4", "B", "ASYNC", "DTZ", "T20", "PTH", "SIM", "RET", "PERF", "A"]
ignore = ["E501", "D", "RUF001", "E741"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI pattern relies on calling these in argument defaults; that's the
# idiomatic usage, not the mutable-default-argument bug B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header",
    "fastapi.Cookie", "fastapi.Body", "fastapi.Form", "fastapi.File", "fastapi.Security",
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.ruff.lint.isort]
known-first-party = ["radarvan"]
# Group FastAPI and related imports together
section-order = [
    "future",
    "standard-library",
    "third-party",
    "fastapi",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"fastapi" = ["fastapi", "pydantic", "sqlalchemy", "starlette"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.14"
strict = true


ignore_missing_imports = false
warn_redundant_casts  = true
warn_return_any = true
warn_unused_ignores  = true
warn_unused_configs  = true
no_implicit_optional = true
namespace_packages = true
explicit_package_bases = true
warn_unreachable = true
show_error_context = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

show_error_codes = true
show_column_numbers = true
pretty = true

# Per-module overrides
[[tool.mypy.overrides]]
# Third-party libraries without type stubs or py.typed marker
module = [
    "uvicorn.*",
    "alembic.*",
    "fsspec.*",   # no stubs available: https://github.com/fsspec/filesystem_spec/issues/451
    "s3fs.*",     # built on fsspec, no stubs
    "apscheduler.*",  # no stubs available
    "onnxruntime.*",  # no stubs available
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Relax strict rules for migration files if using alembic
module = "alembic.versions.*"
ignore_errors = true

[tool.pylsp-mypy]
# Enable the plugin
enabled = true
# Run mypy in live mode as you type
live_mode = true
# Mirror the strictness from the mypy config (optional, can set here directly)
strict = true

# PyTorch CUDA 12.4 wheels — needed so torch ships Pascal (sm_61) kernels for the
# local Quadro P4000. `explicit = true` means ONLY packages mapped to it in
# [tool.uv.sources] are pulled from here; everything else stays on PyPI.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
