# Pre-commit hooks for Radarvan.
#
# Setup (one time):
#   pip install pre-commit        # or: uv tool install pre-commit
#   pre-commit install            # install the git hook
#
# Run against everything on demand:
#   pre-commit run --all-files
#
# These hooks wire up the tools the project already uses (ruff, ruff-format,
# prettier) so they run automatically on `git commit`. Ruff reads its config
# from pyproject.toml; we intentionally do NOT duplicate those settings here.

exclude: |
  (?x)^(
    src/api/|
    public/|
    tests/.*\.json$
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        # Generous limit so the intentional runtime artifacts that are committed
        # (mapparse ~3.2MB, ml_model.onnx) are not flagged.
        args: [--maxkb=5000]

  # Python: lint + format via ruff. Pinned to match `ruff>=0.14.0` in pyproject.
  # Ruff reads all of its settings from pyproject.toml.
  #
  # Scoped to radarvan/ to match the project's canonical lint scope (Makefile:
  # `ruff check radarvan/` / `ruff format radarvan/`). tests/ is intentionally
  # excluded: the project's ruff config selects bandit `S` rules with no
  # per-file-ignore, so linting tests/ would flag every `assert` (S101).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^radarvan/
      - id: ruff-format
        files: ^radarvan/

  # Frontend: prettier (matches .prettierrc.json -> semi: false).
  # Scoped to src/ and respects .prettierignore (which excludes src/api/).
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.6.2
        files: ^src/
        exclude: ^src/api/
