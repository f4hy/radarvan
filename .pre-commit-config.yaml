# Pre-commit hooks for Radarvan.
#
# Setup (one time):
#   uv tool install pre-commit
#   pre-commit install            # install the git hook
#
# Run against everything on demand:
#   pre-commit run --all-files
#
# ruff and biome run as local hooks through uv/npx, so they use the versions
# locked in uv.lock / package-lock.json and read their config from
# pyproject.toml / biome.json - nothing here to keep in sync.

exclude: |
  (?x)^(
    src/api/|
    public/|
    tests/.*\.json$
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        # Generous limit so the intentional runtime artifacts that are committed
        # (mapparse ~3.2MB, ml_ensemble/*.onnx ~44KB each) are not flagged.
        args: [--maxkb=5000]

  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        files: ^(radarvan|tests)/
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        files: ^(radarvan|tests)/
      # format + lint, not `biome check`: that also runs import sorting, which
      # the make targets and CI don't, and would reorder most of src/.
      - id: biome-format
        name: biome format
        entry: npx biome format --write --no-errors-on-unmatched
        language: system
        types_or: [ts, tsx, javascript, jsx, json]
        files: ^(src|e2e)/|^playwright\.config\.ts$
      - id: biome-lint
        name: biome lint
        entry: npx biome lint --write --no-errors-on-unmatched
        language: system
        types_or: [ts, tsx, javascript, jsx, json]
        files: ^(src|e2e)/|^playwright\.config\.ts$
